# Draait bij elke push en pull request op GitHub, zodat je niets op je laptop
# hoeft te installeren. Resultaat: tabblad "Actions" in de repository.
name: Controle

on:
  push:
  pull_request:

jobs:
  controle:
    name: Tests, lint en build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Pakketten installeren
        run: npm ci
      - name: Databaseregels testen
        run: npm run test:db
      - name: Inlogmeldingen testen
        run: npm run test:login
      - name: Formulieren testen
        run: npm run test:forms
      - name: LinkedIn-regels testen (werktijden, feestdagen, omzetten)
        run: npm run test:linkedin
      - name: Automatisch benaderen testen (teksten, afmelding herkennen)
        run: npm run test:outreach
      - name: Codecontrole (lint)
        run: npm run lint
      - name: App bouwen
        run: npm run build
      - name: Browser installeren voor inlogtest
        run: npx playwright install --with-deps chromium
      - name: App testen in een echte browser (inloggen, vacatures, kandidaten, LinkedIn, automatisch benaderen)
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_e2e_test_key_0000
        run: |
          npm run build
          npm run test:e2e
